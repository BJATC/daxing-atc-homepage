<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>大兴塔台一室 6月2日执勤卡片</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;overflow-x:hidden;font-family:"Microsoft YaHei","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased;background:#0f172a;color:#F8FAFC}

/* ====== 搜索页 ====== */
#searchPage{
  min-height:100vh;padding:40px 16px 60px;
  display:flex;flex-direction:column;align-items:center;
}
#searchPage .logo{font-size:42px;margin-bottom:8px}
#searchPage h1{font-size:22px;font-weight:700;letter-spacing:2px;color:#F8FAFC;margin-bottom:4px}
#searchPage .sub{font-size:14px;color:#64748B;margin-bottom:32px}
.search-box{
  width:min(400px,90vw);position:relative;margin-bottom:12px;
}
.search-box input{
  width:100%;padding:14px 18px 14px 44px;
  background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;color:#F8FAFC;font-size:16px;outline:none;
  transition:border-color 0.2s;
}
.search-box input:focus{border-color:#F59E0B}
.search-box input::placeholder{color:#475569}
.search-box .icon{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  font-size:18px;color:#64748B;pointer-events:none;
}
#hintText{
  font-size:13px;color:#475569;margin-bottom:16px;
  width:min(400px,90vw);text-align:center;
}
#suggestions{
  width:min(400px,90vw);list-style:none;
  max-height:320px;overflow-y:auto;
  border-radius:10px;background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.06);
}
#suggestions li{
  padding:12px 16px;cursor:pointer;font-size:15px;
  border-bottom:1px solid rgba(255,255,255,0.03);
  display:flex;justify-content:space-between;align-items:center;
  transition:background 0.15s;
}
#suggestions li:hover,#suggestions li:active{
  background:rgba(245,158,11,0.1);
}
#suggestions li:last-child{border-bottom:none}
#suggestions .sg-name{color:#F8FAFC;font-weight:500}
#suggestions .sg-info{font-size:12px;color:#64748B}
#suggestions .sg-backup{color:#F59E0B}

/* ====== 第一幕：终端 ====== */
#act1{
  position:fixed;inset:0;z-index:50;
  background:#000;padding:20px 16px;overflow-y:auto;
  display:none;
}
#act1::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:1;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,65,0.03) 2px,rgba(0,255,65,0.03) 4px);
}
#act1::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,0.4) 100%);
}
.flicker{
  position:fixed;inset:0;pointer-events:none;z-index:2;
  background:rgba(0,255,65,0.03);opacity:0;transition:opacity 0.1s;
}
.flicker.on{opacity:1}
#terminal{
  position:relative;z-index:3;
  font-family:"Courier New",monospace;
  font-size:13px;line-height:1.5;
  color:#00FF41;text-shadow:0 0 5px rgba(0,255,65,0.5);
  white-space:pre-wrap;word-break:break-all;
}
#terminal .line{min-height:1.5em}
#terminal .cursor{display:inline-block;animation:blink 0.5s step-end infinite}
@keyframes blink{50%{opacity:0}}

/* ====== 第二幕：过渡 ====== */
#act2{
  position:fixed;inset:0;z-index:100;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  background:#000;opacity:0;pointer-events:none;visibility:hidden;
  transition:opacity 0.5s ease;
}
#act2 .bg{
  position:absolute;inset:0;
  background:#000;
  opacity:0;transition:opacity 0.3s ease;
}
#act2.active .bg{opacity:1}
#act2 .progress-wrap{
  width:min(360px,80vw);margin-top:16px;
  opacity:0;transition:opacity 0.3s ease 0.2s;
}
#act2.active .progress-wrap{opacity:1}
#act2 .progress-bar{
  width:100%;height:8px;border-radius:4px;
  background:rgba(255,255,255,0.06);overflow:hidden;
}
#act2 .progress-fill{
  height:100%;width:0%;border-radius:4px;
  background:linear-gradient(90deg,#F59E0B,#8B5CF6);
  box-shadow:0 0 8px rgba(245,158,11,0.3);
  transition:width 0.2s ease;
}
#act2 .progress-info{display:flex;justify-content:space-between;margin-top:6px}
#act2 .progress-pct{font-family:"Courier New",monospace;font-size:14px;color:#F59E0B;font-weight:bold}
#act2 .progress-msg{font-size:11px;color:#94A3B8;font-family:"Courier New",monospace;transition:opacity 0.15s}

/* ====== 第一幕终端内进度条（全屏居中） ====== */
#act1-progress{
  position:fixed;inset:0;z-index:10;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  background:#000;
}
#act1-progress.show{display:flex}
.act1-mission{
  font-family:"Courier New",monospace;font-size:28px;color:#00FF41;
  text-shadow:0 0 20px rgba(0,255,65,0.8),0 0 50px rgba(0,255,65,0.3);
  margin-bottom:24px;letter-spacing:3px;
}
.act1-progress-bar-wrap{
  width:min(420px,80vw);height:16px;
  background:rgba(0,255,65,0.06);border:2px solid rgba(0,255,65,0.3);
  border-radius:8px;overflow:hidden;
}
.act1-progress-fill{
  height:100%;width:0%;border-radius:6px;
  background:linear-gradient(90deg,#00CC33,#00FF41,#00FF88);
  box-shadow:0 0 20px rgba(0,255,65,0.7);
  transition:width 0.15s ease;
}
.act1-progress-pct{
  font-family:"Courier New",monospace;font-size:20px;color:#00FF41;
  text-shadow:0 0 10px rgba(0,255,65,0.6);
  margin-top:12px;font-weight:bold;
}
.act1-progress-msg{
  font-size:13px;color:rgba(0,255,65,0.55);
  font-family:"Courier New",monospace;margin-top:6px;
}

/* ====== 第三幕：成卡 ====== */
:root{
  --card-bg:#f0f2f5;
  --card-surface:#f5f7fa;
  --card-border:#e0e0e0;
  --card-border-accent:#d0d0d0;
  --accent:#1a3a5c;
  --accent-light:#2d6a9f;
  --accent-dim:#e8f0f8;
  --accent-glow:rgba(45,106,159,0.08);
  --indigo:#2d6a9f;
  --indigo-dim:#e8f0f8;
  --green:#276749;
  --green-dim:#e6f4ed;
  --red:#c53030;
  --red-dim:#fff5f5;
  --amber:#8b6914;
  --amber-dim:#fffdf0;
  --amber-border:#f0e8c0;
  --text-primary:#1a1a1a;
  --text-secondary:#555;
  --text-tertiary:#888;
  --text-ghost:#bbb;
  --mono:"SF Mono","JetBrains Mono","Cascadia Code","Fira Code","Courier New",monospace;
  --sans:"Microsoft YaHei","PingFang SC","Helvetica Neue","Segoe UI",sans-serif;
}

#act3{
  position:fixed;inset:0;z-index:200;
  display:none;overflow-y:auto;
  background:var(--card-bg);
  padding:20px 16px 48px;
  -webkit-overflow-scrolling:touch;
}
#act3.show{display:block}

.card{
  max-width:420px;margin:0 auto;
  background:#fff;
  border:none;
  border-radius:12px;overflow:hidden;
  box-shadow:0 2px 12px rgba(0,0,0,0.1);
}

/* 标题区 */
.card-header{
  text-align:center;padding:20px 20px 16px;position:relative;
  background:linear-gradient(135deg,#1a3a5c,#2d6a9f);color:#fff;
}
.card-header .glow{display:none}
.card-header .tower{font-size:28px;margin-bottom:4px;position:relative}
.card-header h1{
  font-size:20px;color:#fff;font-weight:600;
  letter-spacing:3px;margin-bottom:2px;position:relative;
  font-family:var(--sans);
}
.card-header .card-label{
  font-size:10px;color:rgba(255,255,255,0.7);font-weight:400;margin-bottom:4px;
  letter-spacing:4px;position:relative;
  font-family:var(--mono);text-transform:uppercase;
}
.card-header .date{
  font-size:12px;color:rgba(255,255,255,0.6);position:relative;
  font-family:var(--mono);letter-spacing:0.5px;
}

/* 分隔线 */
.divider{display:none}

/* 人物卡 */
.person-box{
  display:flex;flex-wrap:wrap;gap:12px;padding:14px 20px;
  background:var(--card-surface);border-bottom:1px solid var(--card-border);
  margin-bottom:0;
}
.person-avatar{
  width:40px;height:40px;border-radius:10px;
  background:linear-gradient(135deg,#1a3a5c,#2d6a9f);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;color:#fff;font-weight:700;flex-shrink:0;
}
.person-info{flex:1}
.person-name{font-size:16px;color:var(--text-primary);font-weight:600}
.person-role{font-size:12px;color:var(--text-tertiary);margin-top:2px}
.person-status{
  display:flex;align-items:center;gap:4px;
  font-size:13px;color:var(--green);font-weight:500;
}
.person-status .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}

/* 统计三格 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-bottom:0;border-bottom:1px solid var(--card-border)}
.stat-box{
  background:#fff;
  padding:14px 8px;text-align:center;
  border-right:1px solid var(--card-border);
}
.stat-box:last-child{border-right:none}
.stat-box .label{
  font-size:12px;color:var(--text-tertiary);margin-bottom:6px;
}
.stat-box .value{
  font-size:24px;font-weight:700;color:var(--accent);
  font-family:var(--mono);
}
.stat-box .unit{font-size:12px;color:var(--text-tertiary);margin-left:1px}

/* 区块标题 */
.section-title{
  font-size:14px;color:var(--accent);font-weight:600;
  margin-bottom:10px;
}
.section-title::after{display:none}

/* 时间轴 */
.timeline-section{padding:14px 20px;border-bottom:1px solid var(--card-border);margin-bottom:0}
.tl-wrap{
  background:#fff;border:1px solid #e8e8e8;
  border-radius:8px;padding:12px 10px 10px;overflow:hidden;
}
.tl-scale{position:relative;height:40px;border-bottom:1px solid #e0e0e0;margin-bottom:2px}
.tl-mk{position:absolute;bottom:0;width:1px;height:5px;background:#e0e0e0}
.tl-mk.major{height:10px;background:#c0c0c0}
.tl-lbl{
  position:absolute;bottom:-16px;font-size:8px;color:#aaa;
  transform:translateX(-50%);font-family:var(--mono);
}
.tl-bar{
  position:absolute;bottom:0;height:100%;border-radius:3px;opacity:0.88;
  font-size:9px;color:#fff;padding:0 5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-family:var(--mono);
  text-shadow:0 1px 2px rgba(0,0,0,0.3);
  display:flex;align-items:center;
}

/* 时段明细 */
.segments-section{padding:14px 20px;border-bottom:1px solid var(--card-border);margin-bottom:0}
.seg-list{display:flex;flex-direction:column;gap:2px}
.seg-item{
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;
  border-radius:6px;
}
.seg-item:nth-child(odd){background:#f9f9f9}
.seg-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.seg-time{
  font-family:var(--mono);font-size:14px;color:#111;background:#f0f0f0;
  font-weight:700;min-width:100px;padding:2px 6px;border-radius:3px;
}
.seg-dur{
  font-family:var(--mono);font-size:14px;color:#1a3a5c;
  min-width:38px;font-weight:700;
}
.seg-pos{font-size:13px;color:#222;font-weight:600;flex:1}
.seg-bar-wrap{width:40px;height:4px;background:#eee;border-radius:2px;overflow:hidden;flex-shrink:0}
.seg-bar{height:100%;border-radius:2px}

/* 天气 */
.weather-section{padding:14px 20px;background:#f0f7ff;border-top:1px solid #d0e3f5;margin-bottom:0}
.weather-row{display:flex;gap:10px;margin-bottom:10px}
.weather-row:last-of-type{margin-bottom:0}
.weather-icon{font-size:18px;flex-shrink:0;margin-top:1px}
.weather-body{flex:1}
.weather-period{
  font-size:12px;color:#2d6a9f;font-weight:600;margin-bottom:3px;
}
.weather-text{font-size:13px;color:#2d6a9f;line-height:1.6}
.weather-warn{
  display:flex;align-items:center;gap:8px;
  margin-top:10px;padding:10px 12px;
  background:#fff5f5;border:1px solid #fed7d7;
  border-radius:8px;font-size:13px;color:#c53030;
}

/* 注意事项 */
.notes-section{padding:14px 20px;background:#fffdf0;border-top:1px solid #f0e8c0;margin-bottom:0}
.notes-title{
  font-size:14px;color:#8b7300;font-weight:600;margin-bottom:6px;
}
.notes-body{
  font-size:13px;color:#8b7300;line-height:1.6;
  white-space:pre-wrap;
}

/* 搭配提醒 */
.pairing-section{padding:14px 20px;margin-bottom:0}
.pair-line{
  font-size:13px;color:#8b6914;line-height:1.5;
  padding:10px 12px;
  background:#fef5e7;border:1px solid #fde8b8;
  border-radius:8px;
}

/* 备份提醒 */
.backup-section{padding:14px 20px;margin-bottom:0}
.backup-card{
  background:#fffdf5;border:1px solid #f5e6c0;
  border-radius:8px;padding:12px 14px;
}
.backup-date{font-size:14px;color:#8b6914;font-weight:600;margin-bottom:4px}
.backup-note{font-size:12px;color:#888}

/* 西塔通勤提醒 */
.commute-section{padding:14px 20px;background:#f0f4ff;border-top:1px solid #d0ddf5;margin-bottom:0}
.commute-title{font-size:14px;color:#2b6cb0;font-weight:600;margin-bottom:6px}
.commute-warn{font-size:12px;color:#2b6cb0;margin-bottom:8px}
.commute-list{display:flex;flex-wrap:wrap;gap:6px}
.commute-item{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;background:#fff;border:1px solid #dbeafe;border-radius:5px;font-size:12px}
.commute-item .ct-time{font-weight:600;color:#1a3a5c;min-width:38px}
.commute-item .ct-type{font-weight:600}
.commute-item .ct-type.entry{color:#c53030}
.commute-item .ct-type.exit{color:#276749}

/* 返回按钮 */
.back-btn{
  display:flex;align-items:center;gap:6px;
  margin:0 auto 12px;padding:8px 16px;
  background:#fff;border:1px solid #e0e0e0;
  border-radius:8px;color:#555;font-size:13px;cursor:pointer;
  transition:all 0.15s;
}
.back-btn:active{background:#f5f5f5}

/* 底部 */
.card-footer{
  text-align:center;padding:12px 20px;
  border-top:1px solid #e0e0e0;
}
.card-footer .gen-text{
  font-family:var(--mono);
  font-size:10px;color:#bbb;letter-spacing:2px;
}

@media(max-width:400px){
  .card-header{padding:16px 14px 12px}
  .card-header h1{font-size:18px}
  .stat-box .value{font-size:20px}
  .seg-time{font-size:11px;min-width:85px}
  .timeline-section,.segments-section,.weather-section,.notes-section{padding-left:14px;padding-right:14px}
}
</style>
</head>

function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}

// ====== 岗位颜色 ======
function posColor(pos){
  var l=pos.toLowerCase();
  if(l.includes('主干')&&l.includes('见习'))return'#f28e2b';
  if(l.includes('主干'))return'#4e79a7';
  if(l.includes('助理'))return'#59a14f';
  if(l.includes('放行'))return'#76b7b2';
  if(l.includes('地面'))return'#edc948';
  if(l.includes('协调'))return'#b07aa1';
  if(l.includes('主管'))return'#e15759';
  if(l.includes('检查'))return'#9c755f';
  return'#bab0ac';
}

// ====== 搜索功能 ======
var searchInput=$('searchInput'),sugList=$('suggestions'),hintText=$('hintText');
var currentRec=null;

function filterList(q){
  q=q.trim();
  sugList.innerHTML='';
  if(!q){hintText.textContent='共 '+DATA.records.length+' 人执勤 · 输入姓名搜索';return}
  var matches=[];
  DATA.records.forEach(function(r){
    if(r.name.includes(q))matches.push({type:'record',data:r});
  });
  // 备份人员
  Object.keys(DATA.backupMap).forEach(function(name){
    if(name.includes(q)&&!matches.some(function(m){return m.data.name===name})){
      matches.push({type:'backup',name:name,dates:DATA.backupMap[name]});
    }
  });
  if(!matches.length){hintText.textContent='未找到匹配人员';return}
  hintText.textContent='找到 '+matches.length+' 人';
  matches.slice(0,10).forEach(function(m){
    var li=document.createElement('li');
    if(m.type==='record'){
      var r=m.data;
      li.innerHTML='<span class="sg-name">'+esc(r.name)+'</span><span class="sg-info">'+r.totalHours+'h · '+r.segments+'段</span>';
      li.onclick=function(){selectPerson(r)};
    }else{
      li.innerHTML='<span class="sg-name sg-backup">'+esc(m.name)+' [备份]</span><span class="sg-info">'+m.dates.join(', ')+'</span>';
      li.onclick=function(){selectBackup(m.name,m.dates)};
    }
    sugList.appendChild(li);
  });
}

searchInput.addEventListener('input',function(){filterList(this.value)});
searchInput.addEventListener('focus',function(){filterList(this.value)});
document.addEventListener('click',function(e){
  if(!e.target.closest('.search-box')&&!e.target.closest('#suggestions'))sugList.innerHTML='';
});
searchInput.addEventListener('keydown',function(e){
  if(e.key==='Enter'){
    var first=sugList.querySelector('li');
    if(first)first.click();
  }
});

// ====== 第一幕：终端引擎 ======
var term,flickerEl;
var flickerIv=null;

function initTerminal(){
  term=$('terminal');
  flickerEl=$('flicker');
  term.innerHTML='';
  $('act1').style.display='block';
  $('act1').style.opacity='1';
}

function addLine(text){
  var div=document.createElement('div');
  div.className='line';
  if(text!==undefined)div.textContent=text;
  term.appendChild(div);
  term.scrollTop=term.scrollHeight;
  return div;
}

function typeText(el,text,speed){
  return new Promise(function(resolve){
    var i=0;
    var cursor=document.createElement('span');
    cursor.className='cursor';cursor.textContent='█';
    el.appendChild(cursor);
    var iv=setInterval(function(){
      if(i<text.length){
        el.insertBefore(document.createTextNode(text[i]),cursor);
        i++;term.scrollTop=term.scrollHeight;
      }else{
        clearInterval(iv);
        if(cursor.parentNode)cursor.parentNode.removeChild(cursor);
        el.textContent=text;
        resolve();
      }
    },speed);
  });
}

async function typeLine(text,speed){
  var el=addLine('');
  await typeText(el,text,speed||20);
}

function decryptValue(el,label,value){
  return new Promise(function(resolve){
    var padLen=Math.max(value.length,4);
    var pad='';for(var j=0;j<padLen;j++)pad+='█';
    el.textContent=label+pad;
    var chars='0123456789ABCDEF';
    var count=0;
    var iv=setInterval(function(){
      var s='';for(var k=0;k<padLen;k++)s+=chars[Math.floor(Math.random()*chars.length)];
      el.textContent=label+s;
      count++;
      if(count>=6){clearInterval(iv);el.textContent=label+value;resolve();}
    },50);
  });
}

function showProgress(el,blocks,dur){
  return new Promise(function(resolve){
    var filled=0,interval=dur/blocks;
    var iv=setInterval(function(){
      filled++;
      var bar='';for(var i=0;i<blocks;i++)bar+=i<filled?'█':'░';
      el.textContent='['+bar+'] '+Math.round(filled/blocks*100)+'% — LINK ESTABLISHED';
      if(filled>=blocks){clearInterval(iv);resolve();}
    },interval);
  });
}

function showTerminalTimeline(shifts){
  return new Promise(function(resolve){
    var maxLen=28,i=0,tMin=510,tMax=1950,tRange=tMax-tMin;
    function next(){
      if(i>=shifts.length){resolve();return}
      var s=shifts[i],el=addLine('');
      var startPct=(s.startMin-tMin)/tRange;
      var endPct=(s.endMin-tMin)/tRange;
      // Clamp to [0,1] for off-range shifts
      startPct=Math.max(0,Math.min(1,startPct));
      endPct=Math.max(0,Math.min(1,endPct));
      var startPos=Math.round(startPct*maxLen);
      var barLen=Math.max(1,Math.round((endPct-startPct)*maxLen));
      var filled=0;
      var prefix='  ['+s.start+']';
      var suffix='['+s.end+'] '+s.duration.toFixed(1)+'h';
      var growIv=setInterval(function(){
        filled++;
        var bar='';for(var j=0;j<maxLen;j++)bar+=(j>=startPos&&j<startPos+filled)?'▓':'░';
        el.textContent=prefix+bar+suffix;
        term.scrollTop=term.scrollHeight;
        if(filled>=barLen){clearInterval(growIv);i++;setTimeout(next,100);}
      },30);
    }
    next();
  });
}

  await typeLine('───────────────────────────────────────',8);
  await wait(80);

  await typeLine('LOADING DUTY SCHEDULE...',20);
  await showTerminalTimeline(rec.shifts);
  await wait(80);

  await typeLine('',8);
  await typeLine('═══════════════════════════════════════',6);
  var approveLine=addLine('');

  await typeLine('═══════════════════════════════════════',6);

  // 大号进度条 — 显示在终端下方，醒目
  clearInterval(flickerIv);flickerIv=null;
  var progDiv=$('act1-progress'), progFill=$('act1ProgFill');
  var progPct=$('act1ProgPct'), progMsg=$('act1ProgMsg');
  progDiv.classList.add('show');
  progFill.style.width='0%';progPct.textContent='0%';
  progMsg.textContent='';

  var progSteps=[
    {p:20,t:'PARSING SCHEDULE DATA...',d:250},
    {p:45,t:'RENDERING TIMELINE...',d:300},
    {p:70,t:'COMPILING DUTY CARD...',d:300},
    {p:90,t:'APPLYING FINAL TOUCHES...',d:200},
    {p:100,t:'DONE. STANDBY.',d:250}
  ];
  var pi=0;
  await new Promise(function(resolve){
    function nextProgStep(){
      if(pi>=progSteps.length){setTimeout(resolve,300);return}
      var s=progSteps[pi];
      progFill.style.width=s.p+'%';progPct.textContent=s.p+'%';
      progMsg.textContent=s.t;
      pi++;setTimeout(nextProgStep,s.d);
    }
    nextProgStep();
  });

// ====== 第二幕：短过渡 ======
function act2Sequence(){
  return new Promise(function(resolve){
    // 淡出终端
    $('act1').style.transition='opacity 0.3s ease';
    $('act1').style.opacity='0';
    setTimeout(function(){
      $('act1').style.display='none';
      // 短暂黑屏过渡
      $('act2').style.display='flex';
      $('act2').style.opacity='0';
      $('act2').style.visibility='visible';
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          $('act2').style.opacity='1';
          $('act2').classList.add('active');
        });
      });
      // 快速过渡后淡出
      setTimeout(function(){
        $('act2').classList.remove('active');

        setTimeout(function(){
          $('act2').style.display='none';
          $('act2').style.visibility='hidden';
          resolve();
        },400);
      },500);
    },350);
  });
}

// ====== 第三幕：渲染精美卡片 ======
function renderAct3(rec){
  try {
  // 时间轴
  var minH=8.5,maxH=32.5,range=maxH-minH;
  var tlMarks='',tlBars='';
  for(var h2=Math.ceil(minH);h2<=maxH;h2++){
    var pct=(h2-minH)/range*100;
    var mkClass=(h2%4===0)?' major':'';
    tlMarks+='<div class="tl-mk'+mkClass+'" style="left:'+pct+'%"></div>';
    if(h2%4===0){
      var dH=(h2>=24)?h2-24:h2;
      var lbl=(dH<10?'0':'')+dH+':00';
      tlMarks+='<div class="tl-lbl" style="left:'+pct+'%">'+lbl+'</div>';
    }
  }
  var shifts=rec.shifts||[];
  for(var si=0;si<shifts.length;si++){
    var s=shifts[si];
    var leftPct=((s.startMin/60)-minH)/range*100;
    var widthPct=Math.max(s.duration/range*100,0.5);
    var c=posColor(s.position);
    tlBars+='<div class="tl-bar" style="left:'+leftPct+'%;width:'+widthPct+'%;background:'+c+'">'+esc(s.position)+'</div>';
  }

  // 时段明细
  var segItems='';
  for(var si2=0;si2<shifts.length;si2++){
    var s2=shifts[si2];
    var c2=posColor(s2.position);
    segItems+='<div class="seg-item">';
    segItems+='<div class="seg-dot" style="background:'+c2+'"></div>';
    segItems+='<div class="seg-time">'+s2.start+' — '+s2.end+'</div>';
    segItems+='<div class="seg-dur">'+s2.duration.toFixed(1)+'h</div>';
    segItems+='<div class="seg-pos">'+esc(s2.position)+'</div>';
    segItems+='</div>';
  }

  // 搭配提醒
  var pairHTML='';
  var pws=DATA.pairingWarnings||[];
  for(var pi=0;pi<pws.length;pi++){
    if(pws[pi].indexOf(rec.name)>=0) pairHTML+='<div class="pair-line">'+pws[pi]+'</div>';
  }

  // 备份信息
  var backupHTML='';
  if(DATA.backupMap&&DATA.backupMap[rec.name]){
    backupHTML='<div class="backup-section"><div class="section-title">备份备勤</div><div class="backup-card">';
    backupHTML+='<div class="backup-date">备份日期：'+DATA.backupMap[rec.name].join('、')+'</div>';
    backupHTML+='<div class="backup-note">保持通讯畅通，随时响应呼叫<br>备份期间严禁饮酒<br>了解当日天气状况和运行态势<br>备份到岗时间按备份当天值班领导要求准备</div>';
    backupHTML+='</div></div>';
  }

  // 天气
  var weatherHTML='';
  if(DATA.weather){
    weatherHTML='<div class="weather-section"><div class="section-title">天气情报</div>';
    weatherHTML+='<div class="weather-box">';
    weatherHTML+='<div class="weather-row"><span class="weather-icon">🌤️</span><div class="weather-body">';
    weatherHTML+='<div class="weather-text">'+DATA.weather+'</div>';
    weatherHTML+='</div></div>';
    weatherHTML+='</div></div>';
  }

  // 组装卡片
  var html='';
  html+='<div class="back-btn" onclick="goBack()">← 返回搜索</div>';
  html+='<div class="card">';

  // 头部
  html+='<div class="card-header"><div class="glow"></div>';
  html+='<div class="tower">🗼</div>';
  html+='<div class="card-label">DUTY CARD</div>';
  html+='<h1>大兴塔台一室</h1>';
  html+='<div class="date">'+DATA.dateZH+'</div>';
  html+='</div>';

  // 人物
  html+='<div class="person-box">';
  html+='<div class="person-avatar">'+rec.name.charAt(0)+'</div>';
  html+='<div class="person-info">';
  html+='<div class="person-name">'+rec.name+'</div>';
  html+='<div class="person-role">大兴塔台一室</div>';
  html+='</div>';
  html+='<div class="person-status"><span class="dot"></span>'+(rec.status||'正常')+'</div>';
  html+='</div>';

  // 统计
  html+='<div class="stats">';
  html+='<div class="stat-box"><div class="label">工时</div><div><span class="value">'+rec.totalHours+'</span><span class="unit">h</span></div></div>';
  html+='<div class="stat-box"><div class="label">跨度</div><div><span class="value">'+rec.span+'</span><span class="unit">h</span></div></div>';
  html+='<div class="stat-box"><div class="label">段数</div><div><span class="value">'+rec.segments+'</span><span class="unit">段</span></div></div>';
  html+='</div>';

  // 时间轴
  html+='<div class="timeline-section"><div class="section-title">执勤时间轴</div>';
  html+='<div class="tl-wrap"><div class="tl-scale">'+tlMarks+tlBars+'</div></div></div>';


  // 时段明细
  html+='<div class="segments-section"><div class="section-title">时段明细</div>';
  html+='<div class="seg-list">'+segItems+'</div></div>';

  // 西塔通勤提醒
  var commuteHTML='';
  if(DATA.commuteMap&&DATA.commuteMap[rec.name]){
    var entries=DATA.commuteMap[rec.name];
    commuteHTML='<div class="commute-section"><div class="commute-title">西塔通勤提醒</div>';
    commuteHTML+='<div class="commute-warn">今日需前往西塔执勤，请注意通勤时间安排：</div>';
    commuteHTML+='<div class="commute-list">';
    entries.forEach(function(e){
      var typeClass=e.type==='进场'?'entry':'exit';
      var arrow=e.type==='进场'?'→':'←';
      commuteHTML+='<div class="commute-item"><span class="ct-time">'+e.time+'</span><span class="ct-type '+typeClass+'">'+arrow+' '+e.type+'</span></div>';
    });
    commuteHTML+='</div></div>';
  }
  html+=commuteHTML;

  // 天气
  html+=weatherHTML;


  // 注意事项
  if(DATA.notes){
    html+='<div class="notes-section">';
    html+='<div class="notes-box">';
    html+='<div class="notes-title">注意事项</div>';
    html+='<div class="notes-body">'+DATA.notes+'</div>';
    html+='</div></div>';
  }

  // 搭配
  if(pairHTML) html+='<div class="pairing-section"><div class="section-title">搭配提醒</div>'+pairHTML+'</div>';

  // 备份
  html+=backupHTML;

  // 底部
  html+='<div class="card-footer"><div class="gen-text">DUTY CARD GENERATED</div></div>';
  html+='</div>';

  $('act3').innerHTML=html;
  } catch(e){
    $('act3').innerHTML='<div class="back-btn" onclick="goBack()">← 返回搜索</div><div class="card" style="padding:40px 20px;text-align:center"><h2 style="color:#c53030;margin-bottom:12px">卡片生成出错</h2><p style="color:#888">'+e.message+'</p></div>';
  }
}

// ====== 三幕串联 ======
async function runThreeActs(rec){
  try{await act1Sequence(rec);}catch(e){}
  // 进度条完成后直接显示卡片，跳过黑屏过渡
  $('act1').style.display='none';
  $('act2').style.display='none';
  renderAct3(rec);
  $('act3').classList.add('show');
  window.scrollTo(0,0);
}

// ====== 备份人员卡片 ======
function showBackupCard(name,dates){
  var html='<div class="back-btn" onclick="goBack()">← 返回搜索</div>'
    +'<div class="card">'
    +'<div class="card-header"><div class="glow"></div>'
    +'<div class="tower">⚡</div>'
    +'<div class="card-label">BACKUP NOTICE</div>'
    +'<h1>'+esc(name)+'</h1>'
    +'<div class="date">备份人员</div>'
    +'</div>'
    +'<div class="person-box">'
    +'<div class="person-avatar" style="background:linear-gradient(135deg,#FBBF24,#D97706)">'+name.charAt(0)+'</div>'
    +'<div class="person-info">'
    +'<div class="person-name">'+esc(name)+'</div>'
    +'<div class="person-role" style="color:#F59E0B">备份待命</div>'
    +'</div>'
    +'<div class="person-status" style="color:#F59E0B;background:rgba(245,158,11,0.1)"><span class="dot" style="background:#F59E0B"></span>备份</div>'
    +'</div>'
    +'<div class="backup-section"><div class="section-title">备份日期</div><div class="backup-card">';
  dates.forEach(function(d){html+='<div class="backup-date">'+esc(d)+'</div>';});
  html+='</div></div>'
    +'<div class="notes-section"><div class="notes-box">'
    +'<div class="notes-title">备勤要求</div>'
    +'<div class="notes-body">保持通讯畅通，随时响应呼叫\n备份期间严禁饮酒\n了解当日天气状况和运行态势\n备份到岗时间按备份当天值班领导要求准备</div>'
    +'</div></div>'
    +'<div class="card-footer"><div class="gen-text">BACKUP CARD GENERATED</div></div>'
    +'</div>';
  $('act3').innerHTML=html;
  $('act3').classList.add('show');
  window.scrollTo(0,0);
}

// ====== 返回搜索 ======
function goBack(){
  $('act3').classList.remove('show');
  $('act3').innerHTML='';
  $('act1').style.display='none';
  $('act1').style.opacity='1';
  $('act1-progress').classList.remove('show');
  $('act2').style.display='none';
  $('act2').style.opacity='0';
  $('act2').style.visibility='hidden';
  $('act2').style.pointerEvents='none';
  $('searchPage').style.display='flex';
  searchInput.value='';
  hintText.textContent='共 '+DATA.records.length+' 人执勤 · 输入姓名搜索';
  sugList.innerHTML='';
  searchInput.focus();
}

// 初始化提示
(function(){
  var backupCount=Object.keys(DATA.backupMap).length;
  hintText.textContent='共 '+DATA.records.length+' 人执勤 · '+backupCount+' 人备份 · 输入姓名搜索';
  $('searchSub').textContent = DATA.dateZH + ' · 执勤卡片系统';
})();
