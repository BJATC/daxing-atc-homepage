<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>大兴塔台一室 · 执勤卡片</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;overflow-x:hidden;font-family:"Microsoft YaHei","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased;background:#0f172a;color:#F8FAFC}

/* ====== 搜索页 ====== */
#searchPage{
  min-height:100vh;padding:40px 16px 60px;
  display:flex;flex-direction:column;align-items:center;
}
#searchPage .logo{font-size:42px;margin-bottom:8px}
#searchPage h1{font-size:22px;font-weight:700;letter-spacing:2px;color:#F8FAFC;margin-bottom:4px}
#searchPage .sub{font-size:14px;color:#64748B;margin-bottom:32px}
.search-box{
  width:min(400px,90vw);position:relative;margin-bottom:12px;
}
.search-box input{
  width:100%;padding:14px 18px 14px 44px;
  background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;color:#F8FAFC;font-size:16px;outline:none;
  transition:border-color 0.2s;
}
.search-box input:focus{border-color:#F59E0B}
.search-box input::placeholder{color:#475569}
.search-box .icon{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  font-size:18px;color:#64748B;pointer-events:none;
}
#hintText{
  font-size:13px;color:#475569;margin-bottom:16px;
  width:min(400px,90vw);text-align:center;
}
#suggestions{
  width:min(400px,90vw);list-style:none;
  max-height:320px;overflow-y:auto;
  border-radius:10px;background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.06);
}
#suggestions li{
  padding:12px 16px;cursor:pointer;font-size:15px;
  border-bottom:1px solid rgba(255,255,255,0.03);
  display:flex;justify-content:space-between;align-items:center;
  transition:background 0.15s;
}
#suggestions li:hover,#suggestions li:active{
  background:rgba(245,158,11,0.1);
}
#suggestions li:last-child{border-bottom:none}
#suggestions .sg-name{color:#F8FAFC;font-weight:500}
#suggestions .sg-info{font-size:12px;color:#64748B}
#suggestions .sg-backup{color:#F59E0B}

/* ====== 第一幕：终端 ====== */
#act1{
  position:fixed;inset:0;z-index:50;
  background:#000;padding:20px 16px;overflow-y:auto;
  display:none;
}
#act1::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:1;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,65,0.03) 2px,rgba(0,255,65,0.03) 4px);
}
#act1::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,0.4) 100%);
}
.flicker{
  position:fixed;inset:0;pointer-events:none;z-index:2;
  background:rgba(0,255,65,0.03);opacity:0;transition:opacity 0.1s;
}
.flicker.on{opacity:1}
#terminal{
  position:relative;z-index:3;
  font-family:"Courier New",monospace;
  font-size:13px;line-height:1.5;
  color:#00FF41;text-shadow:0 0 5px rgba(0,255,65,0.5);
  white-space:pre-wrap;word-break:break-all;
}
#terminal .line{min-height:1.5em}
#terminal .cursor{display:inline-block;animation:blink 0.5s step-end infinite}
@keyframes blink{50%{opacity:0}}

/* ====== 第二幕：过渡 ====== */
#act2{
  position:fixed;inset:0;z-index:100;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  background:#000;opacity:0;pointer-events:none;visibility:hidden;
  transition:opacity 0.5s ease;
}
#act2 .bg{
  position:absolute;inset:0;
  background:linear-gradient(180deg,#0a0a1a 0%,#1a1a2e 100%);
  opacity:0;transition:opacity 0.8s ease;
}
#act2.active .bg{opacity:1}
#act2 .title{
  font-size:20px;color:#fff;font-weight:600;
  opacity:0;transform:translateY(16px);
  transition:all 0.5s ease 0.2s;text-align:center;
}
#act2 .subtitle{
  font-size:12px;color:#94A3B8;margin-top:6px;
  font-family:"Courier New",monospace;
  opacity:0;transform:translateY(16px);
  transition:all 0.5s ease 0.35s;
}
#act2.active .title,#act2.active .subtitle{opacity:1;transform:translateY(0)}
#act2 .progress-wrap{
  width:min(300px,80vw);margin-top:28px;
  opacity:0;transition:opacity 0.5s ease 0.5s;
}
#act2.active .progress-wrap{opacity:1}
#act2 .progress-bar{
  width:100%;height:6px;border-radius:3px;
  background:rgba(255,255,255,0.08);overflow:hidden;
}
#act2 .progress-fill{
  height:100%;width:0%;border-radius:3px;
  background:linear-gradient(90deg,#FFB000,#6366F1);
  transition:width 0.25s ease;
}
#act2 .progress-info{display:flex;justify-content:space-between;margin-top:6px}
#act2 .progress-pct{font-family:"Courier New",monospace;font-size:13px;color:#FFB000;font-weight:bold}
#act2 .progress-msg{font-size:11px;color:#64748B;font-family:"Courier New",monospace;transition:opacity 0.15s}

/* ====== 第三幕：成卡 ====== */
:root{
  --card-bg:#f0f2f5;
  --card-surface:#f5f7fa;
  --card-border:#e0e0e0;
  --card-border-accent:#d0d0d0;
  --accent:#1a3a5c;
  --accent-light:#2d6a9f;
  --accent-dim:#e8f0f8;
  --accent-glow:rgba(45,106,159,0.08);
  --indigo:#2d6a9f;
  --indigo-dim:#e8f0f8;
  --green:#276749;
  --green-dim:#e6f4ed;
  --red:#c53030;
  --red-dim:#fff5f5;
  --amber:#8b6914;
  --amber-dim:#fffdf0;
  --amber-border:#f0e8c0;
  --text-primary:#1a1a1a;
  --text-secondary:#555;
  --text-tertiary:#888;
  --text-ghost:#bbb;
  --mono:"SF Mono","JetBrains Mono","Cascadia Code","Fira Code","Courier New",monospace;
  --sans:"Microsoft YaHei","PingFang SC","Helvetica Neue","Segoe UI",sans-serif;
}

#act3{
  position:fixed;inset:0;z-index:200;
  display:none;overflow-y:auto;
  background:var(--card-bg);
  padding:20px 16px 48px;
  -webkit-overflow-scrolling:touch;
}
#act3.show{display:block}

.card{
  max-width:420px;margin:0 auto;
  background:#fff;
  border:none;
  border-radius:12px;overflow:hidden;
  box-shadow:0 2px 12px rgba(0,0,0,0.1);
}

/* 标题区 */
.card-header{
  text-align:center;padding:20px 20px 16px;position:relative;
  background:linear-gradient(135deg,#1a3a5c,#2d6a9f);color:#fff;
}
.card-header .glow{display:none}
.card-header .tower{font-size:28px;margin-bottom:4px;position:relative}
.card-header h1{
  font-size:20px;color:#fff;font-weight:600;
  letter-spacing:3px;margin-bottom:2px;position:relative;
  font-family:var(--sans);
}
.card-header .card-label{
  font-size:10px;color:rgba(255,255,255,0.7);font-weight:400;margin-bottom:4px;
  letter-spacing:4px;position:relative;
  font-family:var(--mono);text-transform:uppercase;
}
.card-header .date{
  font-size:12px;color:rgba(255,255,255,0.6);position:relative;
  font-family:var(--mono);letter-spacing:0.5px;
}

/* 分隔线 */
.divider{display:none}

/* 人物卡 */
.person-box{
  display:flex;flex-wrap:wrap;gap:12px;padding:14px 20px;
  background:var(--card-surface);border-bottom:1px solid var(--card-border);
  margin-bottom:0;
}
.person-avatar{
  width:40px;height:40px;border-radius:10px;
  background:linear-gradient(135deg,#1a3a5c,#2d6a9f);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;color:#fff;font-weight:700;flex-shrink:0;
}
.person-info{flex:1}
.person-name{font-size:16px;color:var(--text-primary);font-weight:600}
.person-role{font-size:12px;color:var(--text-tertiary);margin-top:2px}
.person-status{
  display:flex;align-items:center;gap:4px;
  font-size:13px;color:var(--green);font-weight:500;
}
.person-status .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}

/* 统计三格 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-bottom:0;border-bottom:1px solid var(--card-border)}
.stat-box{
  background:#fff;
  padding:14px 8px;text-align:center;
  border-right:1px solid var(--card-border);
}
.stat-box:last-child{border-right:none}
.stat-box .label{
  font-size:12px;color:var(--text-tertiary);margin-bottom:6px;
}
.stat-box .value{
  font-size:24px;font-weight:700;color:var(--accent);
  font-family:var(--mono);
}
.stat-box .unit{font-size:12px;color:var(--text-tertiary);margin-left:1px}

/* 区块标题 */
.section-title{
  font-size:14px;color:var(--accent);font-weight:600;
  margin-bottom:10px;
}
.section-title::after{display:none}

/* 时间轴 */
.timeline-section{padding:14px 20px;border-bottom:1px solid var(--card-border);margin-bottom:0}
.tl-wrap{
  background:#fff;border:1px solid #e8e8e8;
  border-radius:8px;padding:12px 10px 10px;overflow:hidden;
}
.tl-scale{position:relative;height:40px;border-bottom:1px solid #e0e0e0;margin-bottom:2px}
.tl-mk{position:absolute;bottom:0;width:1px;height:5px;background:#e0e0e0}
.tl-mk.major{height:10px;background:#c0c0c0}
.tl-lbl{
  position:absolute;bottom:-16px;font-size:8px;color:#aaa;
  transform:translateX(-50%);font-family:var(--mono);
}
.tl-bar{
  position:absolute;bottom:0;height:100%;border-radius:3px;opacity:0.88;
  font-size:9px;color:#fff;padding:0 5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-family:var(--mono);
  text-shadow:0 1px 2px rgba(0,0,0,0.3);
  display:flex;align-items:center;
}

/* 时段明细 */
.segments-section{padding:14px 20px;border-bottom:1px solid var(--card-border);margin-bottom:0}
.seg-list{display:flex;flex-direction:column;gap:2px}
.seg-item{
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;
  border-radius:6px;
}
.seg-item:nth-child(odd){background:#f9f9f9}
.seg-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.seg-time{
  font-family:var(--mono);font-size:13px;color:var(--text-primary);
  font-weight:500;min-width:95px;
}
.seg-dur{
  font-family:var(--mono);font-size:13px;color:var(--accent-light);
  min-width:36px;font-weight:500;
}
.seg-pos{font-size:12px;color:var(--text-secondary);flex:1}
.seg-bar-wrap{width:40px;height:4px;background:#eee;border-radius:2px;overflow:hidden;flex-shrink:0}
.seg-bar{height:100%;border-radius:2px}

/* 天气 */
.weather-section{padding:14px 20px;background:#f0f7ff;border-top:1px solid #d0e3f5;margin-bottom:0}
.weather-row{display:flex;gap:10px;margin-bottom:10px}
.weather-row:last-of-type{margin-bottom:0}
.weather-icon{font-size:18px;flex-shrink:0;margin-top:1px}
.weather-body{flex:1}
.weather-period{
  font-size:12px;color:#2d6a9f;font-weight:600;margin-bottom:3px;
}
.weather-text{font-size:13px;color:#2d6a9f;line-height:1.6}
.weather-warn{
  display:flex;align-items:center;gap:8px;
  margin-top:10px;padding:10px 12px;
  background:#fff5f5;border:1px solid #fed7d7;
  border-radius:8px;font-size:13px;color:#c53030;
}

/* 注意事项 */
.notes-section{padding:14px 20px;background:#fffdf0;border-top:1px solid #f0e8c0;margin-bottom:0}
.notes-title{
  font-size:14px;color:#8b7300;font-weight:600;margin-bottom:6px;
}
.notes-body{
  font-size:13px;color:#8b7300;line-height:1.6;
  white-space:pre-wrap;
}

/* 搭配提醒 */
.pairing-section{padding:14px 20px;margin-bottom:0}
.pair-line{
  font-size:13px;color:#8b6914;line-height:1.5;
  padding:10px 12px;
  background:#fef5e7;border:1px solid #fde8b8;
  border-radius:8px;
}

/* 备份提醒 */
.backup-section{padding:14px 20px;margin-bottom:0}
.backup-card{
  background:#fffdf5;border:1px solid #f5e6c0;
  border-radius:8px;padding:12px 14px;
}
.backup-date{font-size:14px;color:#8b6914;font-weight:600;margin-bottom:4px}
.backup-note{font-size:12px;color:#888}

/* 返回按钮 */
.back-btn{
  display:flex;align-items:center;gap:6px;
  margin:0 auto 12px;padding:8px 16px;
  background:#fff;border:1px solid #e0e0e0;
  border-radius:8px;color:#555;font-size:13px;cursor:pointer;
  transition:all 0.15s;
}
.back-btn:active{background:#f5f5f5}

/* 底部 */
.card-footer{
  text-align:center;padding:12px 20px;
  border-top:1px solid #e0e0e0;
}
.card-footer .gen-text{
  font-family:var(--mono);
  font-size:10px;color:#bbb;letter-spacing:2px;
}

@media(max-width:400px){
  .card-header{padding:16px 14px 12px}
  .card-header h1{font-size:18px}
  .stat-box .value{font-size:20px}
  .seg-time{font-size:11px;min-width:85px}
  .timeline-section,.segments-section,.weather-section,.notes-section{padding-left:14px;padding-right:14px}
}
</style>
</head>

// ====== 搜索功能 ======
var searchInput=$('searchInput'),sugList=$('suggestions'),hintText=$('hintText');
var currentRec=null;

function filterList(q){
  q=q.trim();
  sugList.innerHTML='';
  if(!q){hintText.textContent='共 '+DATA.records.length+' 人执勤 · 输入姓名搜索';return}
  var matches=[];
  DATA.records.forEach(function(r){
    if(r.name.includes(q))matches.push({type:'record',data:r});
  });
  // 备份人员
  Object.keys(DATA.backupMap).forEach(function(name){
    if(name.includes(q)&&!matches.some(function(m){return m.data.name===name})){
      matches.push({type:'backup',name:name,dates:DATA.backupMap[name]});
    }
  });
  if(!matches.length){hintText.textContent='未找到匹配人员';return}
  hintText.textContent='找到 '+matches.length+' 人';
  matches.slice(0,10).forEach(function(m){
    var li=document.createElement('li');
    if(m.type==='record'){
      var r=m.data;
      li.innerHTML='<span class="sg-name">'+esc(r.name)+'</span><span class="sg-info">'+r.totalHours+'h · '+r.segments+'段</span>';
      li.onclick=function(){selectPerson(r)};
    }else{
      li.innerHTML='<span class="sg-name sg-backup">'+esc(m.name)+' [备份]</span><span class="sg-info">'+m.dates.join(', ')+'</span>';
      li.onclick=function(){selectBackup(m.name,m.dates)};
    }
    sugList.appendChild(li);
  });
}

searchInput.addEventListener('input',function(){filterList(this.value)});
searchInput.addEventListener('focus',function(){filterList(this.value)});
document.addEventListener('click',function(e){
  if(!e.target.closest('.search-box')&&!e.target.closest('#suggestions'))sugList.innerHTML='';

searchInput.addEventListener('keydown',function(e){

    var first=sugList.querySelector('li');

});

// ====== 第一幕：终端引擎 ======
var term,flickerEl;
var flickerIv=null;

function initTerminal(){
  term=$('terminal');
  flickerEl=$('flicker');
  term.innerHTML='';
  $('act1').style.display='block';
  $('act1').style.opacity='1';
}

function addLine(text){
  var div=document.createElement('div');
  div.className='line';
  if(text!==undefined)div.textContent=text;
  term.appendChild(div);
  term.scrollTop=term.scrollHeight;
  return div;
}

function typeText(el,text,speed){
  return new Promise(function(resolve){
    var i=0;
    var cursor=document.createElement('span');
    cursor.className='cursor';cursor.textContent='█';
    el.appendChild(cursor);
    var iv=setInterval(function(){
      if(i<text.length){
        el.insertBefore(document.createTextNode(text[i]),cursor);
        i++;term.scrollTop=term.scrollHeight;
      }else{
        clearInterval(iv);
        if(cursor.parentNode)cursor.parentNode.removeChild(cursor);
        el.textContent=text;
        resolve();
      }
    },speed);
  });
}

async function typeLine(text,speed){
  var el=addLine('');
  await typeText(el,text,speed||20);
}

function decryptValue(el,label,value){
  return new Promise(function(resolve){
    var padLen=Math.max(value.length,4);
    var pad='';for(var j=0;j<padLen;j++)pad+='█';
    el.textContent=label+pad;
    var chars='0123456789ABCDEF';
    var count=0;
    var iv=setInterval(function(){
      var s='';for(var k=0;k<padLen;k++)s+=chars[Math.floor(Math.random()*chars.length)];
      el.textContent=label+s;
      count++;
      if(count>=6){clearInterval(iv);el.textContent=label+value;resolve();}
    },50);
  });
}

function showProgress(el,blocks,dur){
  return new Promise(function(resolve){
    var filled=0,interval=dur/blocks;
    var iv=setInterval(function(){
      filled++;
      var bar='';for(var i=0;i<blocks;i++)bar+=i<filled?'█':'░';
      el.textContent='['+bar+'] '+Math.round(filled/blocks*100)+'% — LINK ESTABLISHED';
      if(filled>=blocks){clearInterval(iv);resolve();}
    },interval);
  });
}

function showTerminalTimeline(shifts){
  return new Promise(function(resolve){
    var maxLen=28,i=0;
    function next(){
      if(i>=shifts.length){resolve();return}
      var s=shifts[i],el=addLine('');
      var startPct=(s.startMin-390)/(1440-390);
      var endPct=s.endMin>s.startMin?(s.endMin-390)/(1440-390):((s.endMin+1440)-390)/(1440-390);
      var startPos=Math.round(startPct*maxLen);
      var barLen=Math.max(1,Math.round((endPct-startPct)*maxLen));
      var filled=0;
      var prefix='  ['+s.start+']';
      var suffix='['+s.end+'] '+s.duration.toFixed(1)+'h';
      var growIv=setInterval(function(){
        filled++;
        var bar='';for(var j=0;j<maxLen;j++)bar+=(j>=startPos&&j<startPos+filled)?'▓':'░';
        el.textContent=prefix+bar+suffix;
        term.scrollTop=term.scrollHeight;
        if(filled>=barLen){clearInterval(growIv);i++;setTimeout(next,100);}
      },30);
    }
    next();
  });
}

function act2Sequence(){
  return new Promise(function(resolve){
    // 淡出终端
    $('act1').style.transition='opacity 0.35s ease';
    $('act1').style.opacity='0';
    setTimeout(function(){
      $('act1').style.display='none';
      // 显示过渡层：先改 display，再用 rAF 触发 opacity 过渡
      $('act2').style.display='flex';
      $('act2').style.opacity='0';
      $('act2').style.visibility='visible';
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          $('act2').style.opacity='1';
          $('act2').style.pointerEvents='auto';
        });
      });
      var fill=$('progFill'),pct=$('progPct'),msg=$('progMsg');
      fill.style.width='0%';pct.textContent='0%';msg.textContent='';
      var steps=[
        {p:15,t:'Parsing schedule data...',d:200},
        {p:35,t:'Rendering timeline...',d:250},
        {p:55,t:'Applying weather overlay...',d:200},
        {p:75,t:'Compiling duty card...',d:250},
        {p:100,t:'DONE.',d:200}
      ];
      var i=0;
      function nextStep(){
        if(i>=steps.length){
          setTimeout(function(){
            // 淡出过渡层
            $('act2').style.opacity='0';
            $('act2').style.pointerEvents='none';
            setTimeout(function(){
              $('act2').style.display='none';
              $('act2').style.visibility='hidden';
              resolve();
            },550);
          },300);
          return;
        }
        var s=steps[i];
        fill.style.width=s.p+'%';pct.textContent=s.p+'%';
        msg.style.opacity='0';
        setTimeout(function(){msg.textContent=s.t;msg.style.opacity='1';i++;nextStep();},120);
      }
      nextStep();
    },400);
  });
}

  html+='<div class="date">2025年5月24日</div>';

  // 人物
  html+='<div class="person-box">';
  html+='<div class="person-avatar">'+rec.name.charAt(0)+'</div>';
  html+='<div class="person-info">';
  html+='<div class="person-name">'+rec.name+'</div>';
  html+='<div class="person-role">大兴塔台一室</div>';
  html+='</div>';
  html+='<div class="person-status"><span class="dot"></span>'+(rec.status||'正常')+'</div>';
  html+='</div>';

  // 统计
  html+='<div class="stats">';
  html+='<div class="stat-box"><div class="label">工时</div><div><span class="value">'+rec.totalHours+'</span><span class="unit">h</span></div></div>';
  html+='<div class="stat-box"><div class="label">跨度</div><div><span class="value">'+rec.span+'</span><span class="unit">h</span></div></div>';
  html+='<div class="stat-box"><div class="label">段数</div><div><span class="value">'+rec.segments+'</span><span class="unit">段</span></div></div>';
  html+='</div>';

  // 时间轴
  html+='<div class="timeline-section"><div class="section-title">执勤时间轴</div>';
  html+='<div class="tl-wrap"><div class="tl-scale">'+tlMarks+tlBars+'</div></div></div>';


  // 时段明细
  html+='<div class="segments-section"><div class="section-title">时段明细</div>';
  html+='<div class="seg-list">'+segItems+'</div></div>';


  // 天气
  html+=weatherHTML;


  // 注意事项
  if(DATA.notes){
    html+='<div class="notes-section">';
    html+='<div class="notes-box">';
    html+='<div class="notes-title">注意事项</div>';
    html+='<div class="notes-body">'+DATA.notes+'</div>';
    html+='</div></div>';
  }

  // 搭配
  if(pairHTML) html+='<div class="pairing-section"><div class="section-title">搭配提醒</div>'+pairHTML+'</div>';

  // 备份
  html+=backupHTML;

  // 底部
  html+='<div class="card-footer"><div class="gen-text">DUTY CARD GENERATED</div></div>';
  html+='</div>';

  console.log('HTML length:',html.length);
  $('act3').innerHTML=html;
  console.log('renderAct3 done');
  } catch(e){
    console.error('renderAct3 error:',e);
    $('act3').innerHTML='<div class="back-btn" onclick="goBack()">← 返回搜索</div><div class="card" style="padding:40px 20px;text-align:center"><h2 style="color:#F59E0B;margin-bottom:12px">卡片生成出错</h2><p style="color:#EF4444">'+e.message+'</p><pre style="color:#94A3B8;font-size:11px;text-align:left;white-space:pre-wrap">'+e.stack+'</pre></div>';
  }
}

// ====== 三幕串联 ======
async function runThreeActs(rec){
  console.log('Starting three acts for:',rec.name);
  try{
    await act1Sequence(rec);
    console.log('Act1 complete');
  }catch(e){
    console.error('Act1 error:',e);
  }
  try{
    await act2Sequence();
    console.log('Act2 complete');
  }catch(e){
    console.error('Act2 error:',e);
  }
  // 无论如何都清理前两幕并显示卡片
  $('act1').style.display='none';
  $('act2').style.display='none';
  $('act2').style.opacity='0';
  $('act2').style.visibility='hidden';
  $('act2').style.pointerEvents='none';
  console.log('Rendering act3...');
  renderAct3(rec);
  console.log('Act3 rendered, showing...');
  $('act3').classList.add('show');
  window.scrollTo(0,0);
  console.log('Done!');
}

    +'<div class="card-header"><div class="glow"></div>'
    +'<div class="tower">⚡</div>'

    +'<h1>'+esc(name)+'</h1>'
    +'<div class="date">备份人员</div>'
    +'</div>'
    +'<div class="person-box">'
    +'<div class="person-avatar" style="background:linear-gradient(135deg,#FBBF24,#D97706)">'+name.charAt(0)+'</div>'
    +'<div class="person-info">'
    +'<div class="person-name">'+esc(name)+'</div>'
    +'<div class="person-role" style="color:#F59E0B">备份待命</div>'
    +'</div>'
    +'<div class="person-status" style="color:#F59E0B;background:rgba(245,158,11,0.1)"><span class="dot" style="background:#F59E0B"></span>备份</div>'
    +'</div>'
    +'<div class="backup-section"><div class="section-title">备份日期</div><div class="backup-card">';
  dates.forEach(function(d){html+='<div class="backup-date">'+esc(d)+'</div>';});
  html+='</div></div>'
    +'<div class="notes-section"><div class="notes-box">'
    +'<div class="notes-title">备勤要求</div>'

function goBack(){
  $('act3').classList.remove('show');
  $('act3').innerHTML='';
  $('act1').style.display='none';
  $('act1').style.opacity='1';
  $('act2').style.display='none';
  $('act2').style.opacity='0';
  $('act2').style.visibility='hidden';
  $('act2').style.pointerEvents='none';
  $('searchPage').style.display='flex';
  searchInput.value='';
  hintText.textContent='共 '+DATA.records.length+' 人执勤 · 输入姓名搜索';
  sugList.innerHTML='';
  searchInput.focus();
}
