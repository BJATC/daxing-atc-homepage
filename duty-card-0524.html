// === POSITION COLOR ===
function posColor(pos) {
  var l = pos.toLowerCase();
  if (l.includes('主干') && l.includes('见习')) return '#f28e2b';
  if (l.includes('主干')) return '#4e79a7';
  if (l.includes('助理')) return '#59a14f';
  if (l.includes('放行')) return '#76b7b2';
  if (l.includes('地面')) return '#edc948';
  if (l.includes('协调')) return '#b07aa1';
  if (l.includes('主管')) return '#e15759';
  if (l.includes('检查')) return '#9c755f';
  return '#bab0ac';
}

// === BUILD CARD ===
function showCard(rec) {
  // 固定时间轴：08:30 到次日 08:30，与排班分析报告保持一致
  var minH = 8.5, maxH = 32.5, range = maxH - minH;

  // scale marks
  var marks = '';
  for (var h = minH; h <= maxH; h++) {
    var pct = ((h - minH) / range * 100).toFixed(2);
    marks += '<div class="tl-mk' + (h % 4 === 0 ? ' major' : '') + '" style="left:' + pct + '%"></div>';
    if (h % 4 === 0) {
      marks += '<div class="tl-lbl" style="left:' + pct + '%">' + String(h % 24).padStart(2, '0') + ':00</div>';
    }
  }

  // bars
  var bars = '';
  rec.shifts.forEach(function(s) {
    var sm = s.startMin / 60;
    var em = s.endMin / 60;
    var left = ((sm - minH) / range * 100).toFixed(2);
    var width = Math.max((em - sm) / range * 100, 0.3).toFixed(2);
    bars += '<div class="tl-bar" style="left:' + left + '%;width:' + width + '%;background:' + posColor(s.position) + '" title="' + s.start + '-' + s.end + ' ' + s.position + ' ' + s.duration + 'h"></div>';
  });

  // shift labels
  var labels = '';
  rec.shifts.forEach(function(s) {
    labels += '<span class="shift-item"><span class="shift-dot" style="background:' + posColor(s.position) + '"></span>' + s.start + '-' + s.end + ' ' + esc(s.position) + ' ' + s.duration + 'h</span>';
  });

  // warnings
  var warnHTML = '';
  if (rec.warnings && rec.warnings.length > 0) {
    warnHTML = '<div class="warn-block"><div class="warn-title">注意事项</div>';
    rec.warnings.forEach(function(w) { warnHTML += '<div class="warn-line">' + esc(w) + '</div>'; });
    warnHTML += '</div>';
  }

  // pairing warnings for this person
  var pairHTML = '';
  DATA.pairingWarnings.forEach(function(pw) {
    if (pw.includes(rec.name)) {
      pairHTML += '<div class="pair-line">' + esc(pw) + '</div>';
    }
  });
  if (pairHTML) {
    pairHTML = '<div class="pairing"><div class="pair-title">搭配提醒</div>' + pairHTML + '</div>';
  }

  var statusClass = rec.status === '正常' ? 'status-ok' : 'status-warn';
  var statusIcon = rec.status === '正常' ? '✓' : '⚠';

  document.getElementById('card').innerHTML =
    '<div class="card-hdr"><h2>个人执勤摘要</h2></div>' +
    '<div class="card-sum">' +
      '<div class="it"><span class="u">姓名</span><span class="v">' + esc(rec.name) + '</span></div>' +
      '<div class="it"><span class="u">工时</span><span class="v">' + rec.totalHours + 'h</span></div>' +
      '<div class="it"><span class="u">跨度</span><span class="v">' + rec.span + 'h</span></div>' +
      '<div class="it"><span class="u">段数</span><span class="v">' + rec.segments + '段</span></div>' +
    '</div>' +
    '<div class="timeline">' +
      '<div class="tl-scale">' + marks + '</div>' +
      '<div class="tl-row">' + bars + '</div>' +
      '<div class="shifts">' + labels + '</div>' +
    '</div>' +
    warnHTML + pairHTML +
    '<div class="card-footer"><span class="status-text ' + statusClass + '">状态：' + esc(rec.status) + ' ' + statusIcon + '</span></div>' +
    (DATA.weather ? '<div class="weather-block"><div class="wtitle">天气状况</div><div class="wbody">' + esc(DATA.weather) + '</div></div>' : '') +
    (DATA.notes ? '<div class="notes-block"><div class="ntitle">注意事项</div><div class="nbody">' + esc(DATA.notes) + '</div></div>' : '') +
    (DATA.backupMap && DATA.backupMap[rec.name] ?
      '<div class="reminders" style="margin:12px 24px;background:#fff5f5;border:2px solid #e15759;border-radius:8px;padding:16px">' +
      '<div class="rem-title">⚠ 备份安排 — ' + DATA.backupMap[rec.name].map(function(d){return esc(d);}).join('、') + '</div>' +
      '<div class="reminder-item">🔔 请保持通讯畅通，随时响应呼叫</div>' +
      '<div class="reminder-item">🔔 备份期间严禁饮酒</div>' +
      '<div class="reminder-item">🔔 了解当日天气状况和运行态势</div>' +
      '<div class="reminder-item">🔔 备份到岗时间按备份当天值班领导要求准备</div></div>' : '');

  document.getElementById('cardWrap').classList.add('show');
  document.getElementById('cardWrap').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  var q = query.trim().toLowerCase();
  if (!q) { listEl.classList.remove('show'); return; }

  var matches = DATA.records.filter(function(r) {
    return r.name.includes(query) || r.name.toLowerCase().includes(q);
  });
  var backupMatches = [];
  if (DATA.backupMap) {
    backupMatches = Object.keys(DATA.backupMap).filter(function(n) {
      return n.includes(query) || n.toLowerCase().includes(q);
    }).filter(function(n) {
      // Don't show the same person in both lists
      return !matches.some(function(r) { return r.name === n; });
    });
  }

  listEl.innerHTML = '';
  if (matches.length === 0 && backupMatches.length === 0) {
    listEl.innerHTML = '<li class="no-match">未找到匹配</li>';
  } else {
    matches.slice(0, 8).forEach(function(r) {
      var li = document.createElement('li');
      li.innerHTML = '<span>' + esc(r.name) + '</span><span class="info">' + r.totalHours + 'h · ' + r.segments + '段' + (r.warnings.length ? ' · ⚠' : '') + '</span>';
      li.addEventListener('click', function() {
        searchEl.value = r.name;
        listEl.classList.remove('show');
        showCard(r);
      });
      listEl.appendChild(li);
    });
    backupMatches.slice(0, 5).forEach(function(n) {
      var li = document.createElement('li');
      var dates = DATA.backupMap[n];
      li.innerHTML = '<span>' + esc(n) + '<span class="backup-badge">备份</span></span><span class="info">' + esc(dates.join('、')) + '</span>';
      li.addEventListener('click', function() {
        searchEl.value = n;
        listEl.classList.remove('show');
        showBackupCard(n, dates);
      });
      listEl.appendChild(li);
    });
  }
  listEl.classList.add('show');
}

searchEl.addEventListener('input', function() { filterList(this.value); });
searchEl.addEventListener('focus', function() { if (this.value) filterList(this.value); });
document.addEventListener('click', function(e) {
  if (!searchEl.contains(e.target) && !listEl.contains(e.target)) listEl.classList.remove('show');
});

// Update hint with backup count
(function() {
  var total = DATA.records.length + (DATA.backupMap ? Object.keys(DATA.backupMap).length : 0);
  var hint = '共 ' + DATA.records.length + ' 人执勤';
  if (DATA.backupMap && Object.keys(DATA.backupMap).length > 0) {
    hint += ' · ' + Object.keys(DATA.backupMap).length + ' 人备份';
  }
  hint += ' · 输入姓名搜索';
  document.getElementById('hintText').textContent = hint;
})();

// Keyboard nav
searchEl.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    var items = listEl.querySelectorAll('li:not(.no-match)');
    if (items.length > 0) { items[0].click(); }
  }
});
</script>
</body>
